    <script>
      // Pre-paint theme/lang bootstrap — MUST run before first paint (FOUC guard).
      // Vue-mounted code runs too late and would flash the wrong theme.
      (function () {
        try {
          // Dark is the signature identity; default to it unless the user has
          // explicitly opted into light (persisted). Not OS-driven.
          var t = localStorage.getItem('sylanne_theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
          var l = localStorage.getItem('sylanne_lang')
          if (l) document.documentElement.setAttribute('data-lang', l)
        } catch (e) {}
      })()
    </script>
