<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Low-end cloud disk I/O saturation warning</title>
  <desc id="desc">A red warning chart showing high disk read BPS and repeated small write BPS spikes before the 2.5.6 cache and write-coalescing fix.</desc>
  <rect width="920" height="420" fill="#fff7f7"/>
  <rect x="22" y="22" width="876" height="376" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/>
  <rect x="42" y="42" width="836" height="62" rx="10" fill="#fee2e2"/>
  <text x="64" y="80" fill="#991b1b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700">严重警示：旧版高频 KV 写入与表情索引扫描可能压满低端云盘 I/O</text>
  <text x="64" y="128" fill="#7f1d1d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">2C/2GB 或低 BPS 云服务器上，旧策略极大概率造成磁盘 I/O 饱和，表现为机器人卡死、硬盘假死或队列长时间不恢复。</text>
  <line x1="86" y1="330" x2="820" y2="330" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="86" y1="174" x2="86" y2="330" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="86" y1="278" x2="820" y2="278" stroke="#e2e8f0"/>
  <line x1="86" y1="226" x2="820" y2="226" stroke="#e2e8f0"/>
  <line x1="86" y1="174" x2="820" y2="174" stroke="#e2e8f0"/>
  <text x="34" y="181" fill="#64748b" font-family="Arial, sans-serif" font-size="13">114M</text>
  <text x="42" y="233" fill="#64748b" font-family="Arial, sans-serif" font-size="13">85M</text>
  <text x="42" y="285" fill="#64748b" font-family="Arial, sans-serif" font-size="13">57M</text>
  <text x="55" y="337" fill="#64748b" font-family="Arial, sans-serif" font-size="13">0</text>
  <polyline points="96,180 168,180 240,180 312,179 384,180 456,179 528,180 600,179 672,179 744,180 790,330" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polyline points="96,326 168,326 240,325 312,326 384,325 456,326 528,325 600,326 672,325 744,326 790,326" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="528" cy="180" r="6" fill="#2563eb"/>
  <circle cx="528" cy="326" r="5" fill="#16a34a"/>
  <rect x="458" y="206" width="248" height="86" rx="10" fill="#ffffff" stroke="#fecaca"/>
  <text x="478" y="234" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">2026-05-16 16:40:00</text>
  <circle cx="482" cy="258" r="5" fill="#2563eb"/>
  <text x="496" y="263" fill="#334155" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">读 BPS 约 107.434M</text>
  <circle cx="482" cy="281" r="5" fill="#16a34a"/>
  <text x="496" y="286" fill="#334155" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">写 BPS 小写高频抖动</text>
  <text x="86" y="365" fill="#991b1b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">v2.5.6 修复：checkpoint 合并写、表情索引缓存与线程扫描、记忆/表情学习批量单写。</text>
</svg>
