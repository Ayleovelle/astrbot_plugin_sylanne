<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="780" viewBox="0 0 1480 780" role="img" aria-labelledby="title desc">
  <title id="title">Sylanne 运行时总览</title>
  <desc id="desc">展示 Sylanne 当前运行时链路。主回复链路突出两端：输入端把用户碎片、群聊消息和撤回事件放入碎片输入池，经完整度 LLM gate 合并成完整意图；输出端只在最终自然语言出现后接管，按语义智能拆条、模拟打字间隔、检查表情包并记录插话断点。中间由 AstrBot Agent 持有完整上下文和工具循环，只暴露唯一 LLM 工具 query_agent_state；后台链路由回复后任务队列、资源守卫、动态 workers、顺序提交和自有记忆库组成；主动发言链路由低频醒来、公式门控、LLM 话题裁决、AstrBot 调度发送和反馈冷却组成。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #475569; }
      .laneMain { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
      .laneBack { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .lanePro { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .nodeBlue { fill: #ffffff; stroke: #2563eb; stroke-width: 2.3; }
      .nodeGreen { fill: #ffffff; stroke: #059669; stroke-width: 2.3; }
      .nodeOrange { fill: #ffffff; stroke: #ea580c; stroke-width: 2.3; }
      .guard { fill: #fef3c7; stroke: #d97706; stroke-width: 2.1; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 23px; font-weight: 800; fill: #1e293b; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #334155; }
      .tag { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 12px; fill: #475569; }
      .inputBand { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 7 6; }
      .outputBand { fill: #fdf2f8; stroke: #f472b6; stroke-width: 2; stroke-dasharray: 7 6; }
      .miniBubble { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.2; }
      .miniReply { fill: #ffffff; stroke: #f9a8d4; stroke-width: 1.2; }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1480" height="780"/>
  <text class="title" x="46" y="54">Sylanne 运行时总览</text>
  <text class="subtitle" x="46" y="82">碎片输入先合并成完整意图；最终回复再拆成逐条消息。上下文和工具循环交给 AstrBot Agent，Sylanne 负责投递节奏与状态回写。</text>

  <rect class="laneMain" x="36" y="110" width="1408" height="190" rx="18"/>
  <text class="label" x="64" y="148">主回复链路：碎片输入先合并，最终回复再拆成即时聊天</text>

  <rect class="inputBand" x="52" y="164" width="382" height="124" rx="16"/>
  <rect class="outputBand" x="1118" y="152" width="274" height="136" rx="16"/>

  <rect class="nodeBlue" x="62" y="176" width="150" height="78" rx="12"/>
  <text class="text" x="137" y="205" text-anchor="middle">碎片输入池</text>
  <text class="small" x="137" y="229" text-anchor="middle">多段 / 群聊 / 撤回</text>

  <rect class="nodeBlue" x="246" y="176" width="178" height="78" rx="12"/>
  <text class="text" x="335" y="205" text-anchor="middle">完整度 LLM gate</text>
  <text class="small" x="335" y="229" text-anchor="middle">未说完就合并，已完就放行</text>

  <rect class="miniBubble" x="76" y="262" width="36" height="20" rx="10"/>
  <text class="tag" x="94" y="276" text-anchor="middle">我</text>
  <rect class="miniBubble" x="120" y="262" width="36" height="20" rx="10"/>
  <text class="tag" x="138" y="276" text-anchor="middle">不</text>
  <rect class="miniBubble" x="164" y="262" width="36" height="20" rx="10"/>
  <text class="tag" x="182" y="276" text-anchor="middle">是</text>
  <rect class="miniBubble" x="208" y="262" width="42" height="20" rx="10"/>
  <text class="tag" x="229" y="276" text-anchor="middle">老</text>
  <rect class="miniBubble" x="258" y="262" width="70" height="20" rx="10"/>
  <text class="tag" x="293" y="276" text-anchor="middle">年人</text>
  <text class="tag" x="372" y="276" text-anchor="middle">→ 我不是老年人</text>

  <rect class="nodeBlue" x="458" y="176" width="190" height="78" rx="12"/>
  <text class="text" x="553" y="207" text-anchor="middle">AstrBot Agent</text>
  <text class="small" x="553" y="231" text-anchor="middle">完整上下文 + 工具循环</text>

  <rect class="guard" x="682" y="164" width="214" height="102" rx="12"/>
  <text class="text" x="789" y="196" text-anchor="middle">唯一工具入口</text>
  <text class="small" x="789" y="221" text-anchor="middle">query_agent_state</text>
  <text class="small" x="789" y="244" text-anchor="middle">细分工具 schema 隐藏</text>

  <rect class="nodeBlue" x="930" y="176" width="166" height="78" rx="12"/>
  <text class="text" x="1013" y="207" text-anchor="middle">主 LLM 回复</text>
  <text class="small" x="1013" y="231" text-anchor="middle">工具中间轮次放行</text>

  <rect class="nodeBlue" x="1130" y="164" width="248" height="102" rx="12"/>
  <text class="text" x="1254" y="194" text-anchor="middle">即时聊天投递层</text>
  <text class="small" x="1254" y="218" text-anchor="middle">按语义智能拆条，不截断主回复</text>
  <text class="small" x="1254" y="240" text-anchor="middle">打字间隔 / 表情检查 / 插话断点</text>

  <rect class="miniReply" x="1150" y="270" width="62" height="20" rx="10"/>
  <text class="tag" x="1181" y="284" text-anchor="middle">第 1 条</text>
  <rect class="miniReply" x="1222" y="270" width="54" height="20" rx="10"/>
  <text class="tag" x="1249" y="284" text-anchor="middle">停顿</text>
  <rect class="miniReply" x="1286" y="270" width="76" height="20" rx="10"/>
  <text class="tag" x="1324" y="284" text-anchor="middle">第 2 条</text>

  <path class="arrowBlue" d="M212 215 H246"/>
  <path class="arrowBlue" d="M424 215 H458"/>
  <path class="arrowBlue" d="M648 215 H682"/>
  <path class="arrowBlue" d="M896 215 H930"/>
  <path class="arrowBlue" d="M1096 215 H1130"/>

  <rect class="laneBack" x="36" y="338" width="1408" height="192" rx="18"/>
  <text class="label" x="64" y="376">后台链路：慢任务并行，但同会话顺序提交</text>

  <rect class="nodeGreen" x="66" y="408" width="214" height="76" rx="12"/>
  <text class="text" x="173" y="438" text-anchor="middle">回复后任务队列</text>
  <text class="small" x="173" y="462" text-anchor="middle">评估 / 记忆 / 诊断</text>

  <rect class="guard" x="332" y="398" width="230" height="96" rx="12"/>
  <text class="text" x="447" y="430" text-anchor="middle">资源守卫</text>
  <text class="small" x="447" y="455" text-anchor="middle">队列、等待、重试</text>
  <text class="small" x="447" y="476" text-anchor="middle">CPU / 内存压力</text>

  <rect class="nodeGreen" x="614" y="398" width="230" height="96" rx="12"/>
  <text class="text" x="729" y="430" text-anchor="middle">动态 workers</text>
  <text class="small" x="729" y="455" text-anchor="middle">基础 1，逐级扩容</text>
  <text class="small" x="729" y="476" text-anchor="middle">全局上限 6，空闲关闭</text>

  <rect class="nodeGreen" x="896" y="398" width="214" height="96" rx="12"/>
  <text class="text" x="1003" y="430" text-anchor="middle">状态与记忆更新</text>
  <text class="small" x="1003" y="455" text-anchor="middle">情绪、人格漂移、群聊</text>
  <text class="small" x="1003" y="476" text-anchor="middle">自有记忆强化 / 遗忘</text>

  <rect class="nodeGreen" x="1162" y="408" width="214" height="76" rx="12"/>
  <text class="text" x="1269" y="438" text-anchor="middle">顺序写入</text>
  <text class="small" x="1269" y="462" text-anchor="middle">KV / memory / runtime</text>

  <path class="arrowGreen dash" d="M1254 266 C1254 318 173 318 173 408"/>
  <path class="arrowGreen" d="M280 446 H332"/>
  <path class="arrowGreen" d="M562 446 H614"/>
  <path class="arrowGreen" d="M844 446 H896"/>
  <path class="arrowGreen" d="M1110 446 H1162"/>

  <rect class="lanePro" x="36" y="568" width="1408" height="170" rx="18"/>
  <text class="label" x="64" y="606">主动发言支路：不是定时模板，是状态驱动的请求发送</text>

  <rect class="nodeOrange" x="66" y="638" width="180" height="66" rx="12"/>
  <text class="text" x="156" y="666" text-anchor="middle">低频醒来</text>
  <text class="small" x="156" y="688" text-anchor="middle">最近可触达会话</text>

  <rect class="nodeOrange" x="304" y="628" width="220" height="86" rx="12"/>
  <text class="text" x="414" y="660" text-anchor="middle">公式门控</text>
  <text class="small" x="414" y="684" text-anchor="middle">想念 / 互需 / 调皮 / 修复</text>

  <rect class="nodeOrange" x="582" y="628" width="236" height="86" rx="12"/>
  <text class="text" x="700" y="660" text-anchor="middle">LLM 裁决理由与话题</text>
  <text class="small" x="700" y="684" text-anchor="middle">必须有证据，无理由就沉默</text>

  <rect class="nodeOrange" x="876" y="638" width="196" height="66" rx="12"/>
  <text class="text" x="974" y="666" text-anchor="middle">请求 AstrBot</text>
  <text class="small" x="974" y="688" text-anchor="middle">调度器发送消息</text>

  <rect class="nodeOrange" x="1130" y="638" width="246" height="66" rx="12"/>
  <text class="text" x="1253" y="666" text-anchor="middle">反馈冷却</text>
  <text class="small" x="1253" y="688" text-anchor="middle">未回复、冷场、打断都会回写</text>

  <path class="arrowOrange dash" d="M1269 484 C1269 548 156 548 156 638"/>
  <path class="arrowOrange" d="M246 671 H304"/>
  <path class="arrowOrange" d="M524 671 H582"/>
  <path class="arrowOrange" d="M818 671 H876"/>
  <path class="arrowOrange" d="M1072 671 H1130"/>
</svg>
