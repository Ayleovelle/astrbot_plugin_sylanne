<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="780" viewBox="0 0 1480 780" role="img" aria-labelledby="title desc">
  <title id="title">运行时总览</title>
  <desc id="desc">展示主回复链路、带 CPU/内存环境守卫和全局预算的后台自适应 worker、判断 LLM 并发闸门、并行状态读取、顺序提交和主动发言裁决支路。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .laneMain { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
      .laneWorker { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .laneProactive { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .nodeGreen { fill: #ffffff; stroke: #047857; stroke-width: 2; }
      .nodeOrange { fill: #ffffff; stroke: #9a3412; stroke-width: 2; }
      .decision { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 21px; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #334155; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #1e293b; }
      .tag { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #475569; }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>
  <rect class="bg" width="1480" height="780"/>

  <rect class="laneMain" x="36" y="36" width="1408" height="210" rx="18"/>
  <text class="label" x="64" y="76">主回复链路：并发读取，主回复先返回</text>
  <g>
    <rect class="node" x="64" y="112" width="148" height="82" rx="12"/>
    <text class="text" x="138" y="147" text-anchor="middle">用户/群聊</text>
    <text class="text" x="138" y="176" text-anchor="middle">消息</text>

    <rect class="node" x="246" y="112" width="164" height="82" rx="12"/>
    <text class="text" x="328" y="147" text-anchor="middle">会话轨道</text>
    <text class="small" x="328" y="176" text-anchor="middle">speaker / group</text>

    <rect class="node" x="444" y="100" width="232" height="106" rx="12"/>
    <text class="text" x="560" y="135" text-anchor="middle">并发读取快照</text>
    <text class="small" x="560" y="165" text-anchor="middle">emotion / humanlike / drift</text>
    <text class="small" x="560" y="190" text-anchor="middle">lifelike / group 等</text>

    <rect class="node" x="710" y="112" width="170" height="82" rx="12"/>
    <text class="text" x="795" y="147" text-anchor="middle">预算内</text>
    <text class="text" x="795" y="176" text-anchor="middle">注入状态</text>

    <rect class="node" x="914" y="112" width="156" height="82" rx="12"/>
    <text class="text" x="992" y="147" text-anchor="middle">主 LLM</text>
    <text class="text" x="992" y="176" text-anchor="middle">先回复</text>

    <rect class="node" x="1104" y="100" width="270" height="106" rx="12"/>
    <text class="text" x="1239" y="135" text-anchor="middle">post 任务入后台队列</text>
    <text class="small" x="1239" y="165" text-anchor="middle">主链路不等待内部评估</text>
    <text class="small" x="1239" y="190" text-anchor="middle">按会话保存 sequence</text>
  </g>
  <path class="arrowBlue" d="M212 153 H246"/>
  <path class="arrowBlue" d="M410 153 H444"/>
  <path class="arrowBlue" d="M676 153 H710"/>
  <path class="arrowBlue" d="M880 153 H914"/>
  <path class="arrowBlue" d="M1070 153 H1104"/>

  <rect class="laneWorker" x="36" y="286" width="1408" height="214" rx="18"/>
  <text class="label" x="64" y="326">后台智能 worker：环境守卫，全局预算，平滑扩容</text>
  <g>
    <path class="decision" d="M188 364 L322 424 L188 484 L54 424 Z"/>
    <text class="text" x="188" y="416" text-anchor="middle">压力评分</text>
    <text class="small" x="188" y="444" text-anchor="middle">队列/等待/重试/租约</text>

    <rect class="nodeGreen" x="370" y="370" width="220" height="108" rx="12"/>
    <text class="text" x="480" y="405" text-anchor="middle">资源守卫</text>
    <text class="small" x="480" y="435" text-anchor="middle">CPU / 内存 / 未知压力</text>
    <text class="small" x="480" y="460" text-anchor="middle">高压自动降档</text>

    <rect class="nodeGreen" x="640" y="370" width="226" height="108" rx="12"/>
    <text class="text" x="753" y="405" text-anchor="middle">全局 worker 预算</text>
    <text class="small" x="753" y="435" text-anchor="middle">同时活跃总上限 6</text>
    <text class="small" x="753" y="460" text-anchor="middle">冷却内每轮升 1 档</text>

    <rect class="nodeGreen" x="916" y="370" width="200" height="108" rx="12"/>
    <text class="text" x="1016" y="405" text-anchor="middle">判断 LLM 闸门</text>
    <text class="small" x="1016" y="435" text-anchor="middle">默认 2 路，极端最多 3</text>
    <text class="small" x="1016" y="460" text-anchor="middle">低信号走本地轻评估</text>

    <rect class="nodeGreen" x="1166" y="370" width="230" height="108" rx="12"/>
    <text class="text" x="1281" y="405" text-anchor="middle">顺序提交与诊断</text>
    <text class="small" x="1281" y="435" text-anchor="middle">sequence 合并 / KV</text>
    <text class="small" x="1281" y="460" text-anchor="middle">记忆注解 / runtime</text>
  </g>
  <path class="arrowGreen" d="M322 424 H370"/>
  <path class="arrowGreen" d="M590 424 H640"/>
  <path class="arrowGreen" d="M866 424 H916"/>
  <path class="arrowGreen" d="M1116 424 H1166"/>
  <path class="arrowGreen dash" d="M1239 206 C1239 250 188 250 188 364"/>
  <text class="tag" x="1024" y="268">post 队列进入后台 worker 调度</text>

  <rect class="laneProactive" x="36" y="540" width="1408" height="198" rx="18"/>
  <text class="label" x="64" y="580">主动发言支路：并行快照 + 公式门控 + LLM 话题裁决</text>
  <g>
    <rect class="nodeOrange" x="64" y="612" width="200" height="76" rx="12"/>
    <text class="text" x="164" y="643" text-anchor="middle">调度器 / 插件</text>
    <text class="small" x="164" y="670" text-anchor="middle">或 LLM 工具调用</text>

    <rect class="nodeOrange" x="314" y="600" width="232" height="100" rx="12"/>
    <text class="text" x="430" y="634" text-anchor="middle">并发读取状态</text>
    <text class="small" x="430" y="663" text-anchor="middle">emotion / lifelike / group</text>
    <text class="small" x="430" y="688" text-anchor="middle">humanlike / drift</text>

    <path class="decision" d="M716 594 L850 650 L716 706 L582 650 Z"/>
    <text class="text" x="716" y="643" text-anchor="middle">适合开口?</text>
    <text class="small" x="716" y="671" text-anchor="middle">互需/冷却/打断风险</text>

    <rect class="nodeOrange" x="900" y="600" width="224" height="100" rx="12"/>
    <text class="text" x="1012" y="634" text-anchor="middle">LLM 裁决话题</text>
    <text class="small" x="1012" y="663" text-anchor="middle">需求 / 被需要感</text>
    <text class="small" x="1012" y="688" text-anchor="middle">开口风格</text>

    <rect class="nodeOrange" x="1174" y="612" width="200" height="76" rx="12"/>
    <text class="text" x="1274" y="643" text-anchor="middle">返回候选</text>
    <text class="small" x="1274" y="670" text-anchor="middle">由调用方决定发送</text>
  </g>
  <path class="arrowOrange" d="M264 650 H314"/>
  <path class="arrowOrange" d="M546 650 H582"/>
  <path class="arrowOrange" d="M850 650 H900"/>
  <path class="arrowOrange" d="M1124 650 H1174"/>
  <path class="arrowOrange dash" d="M1281 478 C1281 525 430 520 430 600"/>
  <text class="tag" x="930" y="526">长期状态反哺主动性</text>
</svg>
