<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" role="img" aria-labelledby="title desc">
  <title id="title">工作流对比、Agent 上下文与后台并行调度</title>
  <desc id="desc">展示旧版单线程链路与当前版本的 Agent 持有上下文、Sylanne 投递接管、工具调用旁路、回复后后台队列、动态后台工作器池、资源守卫、顺序提交和主动发言安静门。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; fill: #475569; }
      .laneOld { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .laneMain { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
      .laneQueue { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .laneProactive { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .nodeBlue { fill: #ffffff; stroke: #2563eb; stroke-width: 2.4; }
      .nodeGreen { fill: #ffffff; stroke: #059669; stroke-width: 2.4; }
      .nodeOrange { fill: #ffffff; stroke: #ea580c; stroke-width: 2.4; }
      .nodeOld { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .queue { fill: #d1fae5; stroke: #059669; stroke-width: 2.4; }
      .worker { fill: #ffffff; stroke: #16a34a; stroke-width: 2.4; }
      .guard { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; }
      .decision { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.4; }
      .badgeBlue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
      .badgeGreen { fill: #dcfce7; stroke: #86efac; stroke-width: 1.5; }
      .badgeOrange { fill: #ffedd5; stroke: #fdba74; stroke-width: 1.5; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 19px; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #334155; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .laneTitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #1e293b; }
      .arrowBlue { stroke: #2563eb; stroke-width: 3.2; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #059669; stroke-width: 3.2; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #ea580c; stroke-width: 3.2; fill: none; marker-end: url(#arrowOrange); }
      .arrowGray { stroke: #64748b; stroke-width: 2.8; fill: none; marker-end: url(#arrowGray); }
      .dash { stroke-dasharray: 9 8; }
      .thick { stroke-width: 5; }
    </style>
  </defs>

  <rect class="bg" width="1560" height="1180"/>
  <text class="title" x="60" y="58">Sylanne 当前工作流：上下文归 Agent，投递由 Sylanne 接管</text>
  <text class="subtitle" x="60" y="88">重点不是“多开线程”，而是让工具调用和长期上下文留在 Agent，Sylanne 只做短状态、记忆召回、投递信封和后台顺序提交。</text>

  <rect class="laneOld" x="42" y="126" width="312" height="970" rx="20"/>
  <text class="laneTitle" x="66" y="166">0.5.0 旧版单线程</text>
  <text class="small" x="66" y="194">请求内顺序执行，容易互相等待</text>

  <rect class="laneMain" x="390" y="126" width="340" height="970" rx="20"/>
  <text class="laneTitle" x="414" y="166">当前主回复链路</text>
  <text class="small" x="414" y="194">Agent 管上下文，Sylanne 管投递事实</text>

  <rect class="laneQueue" x="766" y="126" width="432" height="970" rx="20"/>
  <text class="laneTitle" x="790" y="166">后台运行：队列 + 并行工作器池</text>
  <text class="small" x="790" y="194">并行处理，但按同一会话顺序提交</text>
  <rect class="badgeGreen" x="804" y="214" width="356" height="44" rx="14"/>
  <text class="small" x="982" y="242" text-anchor="middle">后台持续运行，不阻塞主回复</text>

  <rect class="laneProactive" x="1234" y="126" width="284" height="970" rx="20"/>
  <text class="laneTitle" x="1258" y="166">主动发言支路</text>
  <text class="small" x="1258" y="194">低频醒来，先判断再请求发送</text>

  <g id="old-flow">
    <rect class="nodeOld" x="78" y="246" width="238" height="58" rx="12"/>
    <text class="text" x="197" y="282" text-anchor="middle">用户消息</text>
    <path class="arrowGray" d="M197 304 V344"/>

    <rect class="nodeOld" x="78" y="344" width="238" height="72" rx="12"/>
    <text class="text" x="197" y="374" text-anchor="middle">顺序读取状态</text>
    <text class="tiny" x="197" y="398" text-anchor="middle">情绪、记忆、辅助层依次等待</text>
    <path class="arrowGray" d="M197 416 V456"/>

    <rect class="nodeOld" x="78" y="456" width="238" height="72" rx="12"/>
    <text class="text" x="197" y="486" text-anchor="middle">请求内评估</text>
    <text class="tiny" x="197" y="510" text-anchor="middle">慢模型会拖住主回复</text>
    <path class="arrowGray" d="M197 528 V568"/>

    <rect class="nodeOld" x="78" y="568" width="238" height="72" rx="12"/>
    <text class="text" x="197" y="598" text-anchor="middle">注入提示词</text>
    <text class="tiny" x="197" y="622" text-anchor="middle">状态细节更容易堆进上下文</text>
    <path class="arrowGray" d="M197 640 V680"/>

    <rect class="nodeOld" x="78" y="680" width="238" height="72" rx="12"/>
    <text class="text" x="197" y="710" text-anchor="middle">主模型回复</text>
    <text class="tiny" x="197" y="734" text-anchor="middle">用户必须等整条链路完成</text>
    <path class="arrowGray" d="M197 752 V792"/>

    <rect class="nodeOld" x="78" y="792" width="238" height="72" rx="12"/>
    <text class="text" x="197" y="822" text-anchor="middle">写回状态</text>
    <text class="tiny" x="197" y="846" text-anchor="middle">失败时排查粒度较粗</text>

    <rect class="badgeBlue" x="82" y="922" width="230" height="92" rx="14"/>
    <text class="small" x="197" y="952" text-anchor="middle">问题表现</text>
    <text class="tiny" x="197" y="976" text-anchor="middle">慢评估阻塞回复</text>
    <text class="tiny" x="197" y="998" text-anchor="middle">群聊和主动发言难以分层</text>
  </g>

  <g id="main-flow">
    <rect class="nodeBlue" x="430" y="246" width="260" height="58" rx="12"/>
    <text class="text" x="560" y="282" text-anchor="middle">用户 / 群聊消息</text>
    <path class="arrowBlue" d="M560 304 V344"/>

    <rect class="nodeBlue" x="430" y="344" width="260" height="78" rx="12"/>
    <text class="text" x="560" y="375" text-anchor="middle">Agent 持有上下文</text>
    <text class="tiny" x="560" y="399" text-anchor="middle">插件只补短事实，不搬运大段历史</text>
    <path class="arrowBlue" d="M560 422 V462"/>

    <rect class="nodeBlue" x="430" y="462" width="260" height="88" rx="12"/>
    <text class="text" x="560" y="494" text-anchor="middle">工具调用完全旁路</text>
    <text class="tiny" x="560" y="518" text-anchor="middle">tool_calls / function_call 交回 Agent</text>
    <text class="tiny" x="560" y="538" text-anchor="middle">不阻断、不改写、不消费 epoch</text>
    <path class="arrowBlue" d="M560 550 V590"/>

    <rect class="nodeBlue" x="430" y="590" width="260" height="86" rx="12"/>
    <text class="text" x="560" y="622" text-anchor="middle">短状态与自有记忆召回</text>
    <text class="tiny" x="560" y="646" text-anchor="middle">只注入必要摘要，避免上下文膨胀</text>
    <path class="arrowBlue" d="M560 676 V716"/>

    <rect class="nodeBlue" x="430" y="716" width="260" height="78" rx="12"/>
    <text class="text" x="560" y="747" text-anchor="middle">最终回复投递信封</text>
    <text class="tiny" x="560" y="771" text-anchor="middle">分条接管，但 Agent 知道未必送达</text>

    <rect class="badgeBlue" x="430" y="874" width="260" height="108" rx="14"/>
    <text class="small" x="560" y="904" text-anchor="middle">主链路边界</text>
    <text class="tiny" x="560" y="928" text-anchor="middle">上下文归 Agent</text>
    <text class="tiny" x="560" y="950" text-anchor="middle">工具归 Agent</text>
    <text class="tiny" x="560" y="972" text-anchor="middle">Sylanne 只接管最终文本投递</text>
  </g>

  <g id="queue-and-workers">
    <rect class="queue" x="806" y="278" width="352" height="78" rx="14"/>
    <text class="text" x="982" y="309" text-anchor="middle">回复后任务入后台队列</text>
    <text class="tiny" x="982" y="334" text-anchor="middle">带顺序号、租约、重试信息，不阻塞主回复</text>

    <path class="arrowGreen thick" d="M690 755 C744 755 748 317 806 317"/>

    <rect class="guard" x="806" y="394" width="352" height="92" rx="14"/>
    <text class="text" x="982" y="426" text-anchor="middle">压力与资源守卫</text>
    <text class="tiny" x="982" y="451" text-anchor="middle">队列深度、等待时间、重试、租约</text>
    <text class="tiny" x="982" y="473" text-anchor="middle">CPU / 内存压力高时自动降档</text>
    <path class="arrowGreen" d="M982 356 V394"/>

    <rect class="nodeGreen" x="806" y="530" width="352" height="92" rx="14"/>
    <text class="text" x="982" y="562" text-anchor="middle">自动决定开几个后台工作器</text>
    <text class="tiny" x="982" y="588" text-anchor="middle">基础 1 个，逐级扩容，不直接冲到上限</text>
    <text class="tiny" x="982" y="610" text-anchor="middle">全插件同时活跃硬上限：6</text>
    <path class="arrowGreen" d="M982 486 V530"/>

    <rect class="badgeGreen" x="830" y="650" width="304" height="34" rx="12"/>
    <text class="tiny" x="982" y="672" text-anchor="middle">并行工作器池 / 后台持续运行 / 空闲自动收束</text>

    <g id="worker-pool">
      <rect class="worker" x="816" y="706" width="96" height="72" rx="14"/>
      <text class="small" x="864" y="736" text-anchor="middle">工作器 1</text>
      <text class="tiny" x="864" y="758" text-anchor="middle">活跃</text>

      <rect class="worker" x="928" y="706" width="96" height="72" rx="14"/>
      <text class="small" x="976" y="736" text-anchor="middle">工作器 2</text>
      <text class="tiny" x="976" y="758" text-anchor="middle">活跃</text>

      <rect class="worker" x="1040" y="706" width="96" height="72" rx="14"/>
      <text class="small" x="1088" y="736" text-anchor="middle">工作器 3</text>
      <text class="tiny" x="1088" y="758" text-anchor="middle">活跃</text>

      <rect class="worker" x="816" y="802" width="96" height="72" rx="14" opacity="0.58"/>
      <text class="small" x="864" y="832" text-anchor="middle">工作器 4</text>
      <text class="tiny" x="864" y="854" text-anchor="middle">待命</text>

      <rect class="worker" x="928" y="802" width="96" height="72" rx="14" opacity="0.58"/>
      <text class="small" x="976" y="832" text-anchor="middle">工作器 5</text>
      <text class="tiny" x="976" y="854" text-anchor="middle">待命</text>

      <rect class="worker" x="1040" y="802" width="96" height="72" rx="14" opacity="0.58"/>
      <text class="small" x="1088" y="832" text-anchor="middle">工作器 6</text>
      <text class="tiny" x="1088" y="854" text-anchor="middle">待命</text>

      <text class="small" x="982" y="912" text-anchor="middle">后台最多 6 个工作器；判断模型另有并发闸门</text>
    </g>

    <path class="arrowGreen" d="M982 622 V706"/>
    <path class="arrowGreen dash" d="M982 742 C942 706 890 690 864 706"/>
    <path class="arrowGreen dash" d="M982 742 C970 706 976 690 976 706"/>
    <path class="arrowGreen dash" d="M982 742 C1010 706 1040 690 1088 706"/>

    <rect class="nodeGreen" x="806" y="960" width="352" height="78" rx="14"/>
    <text class="text" x="982" y="992" text-anchor="middle">并行评估，顺序提交</text>
    <text class="tiny" x="982" y="1016" text-anchor="middle">同一会话按顺序号写入，避免情绪轨迹乱序</text>
    <path class="arrowGreen" d="M982 874 V960"/>

  </g>

  <g id="proactive-flow">
    <rect class="nodeOrange" x="1264" y="246" width="224" height="70" rx="12"/>
    <text class="text" x="1376" y="274" text-anchor="middle">最近可触达会话</text>
    <text class="tiny" x="1376" y="298" text-anchor="middle">登记来源与冷却窗口</text>
    <path class="arrowOrange" d="M1376 316 V356"/>

    <rect class="nodeOrange" x="1264" y="356" width="224" height="82" rx="12"/>
    <text class="text" x="1376" y="386" text-anchor="middle">低频后台醒来</text>
    <text class="tiny" x="1376" y="410" text-anchor="middle">先检查环境压力和安静门</text>
    <path class="arrowOrange" d="M1376 438 V478"/>

    <rect class="nodeOrange" x="1264" y="478" width="224" height="94" rx="12"/>
    <text class="text" x="1376" y="508" text-anchor="middle">公式计算开口时机</text>
    <text class="tiny" x="1376" y="532" text-anchor="middle">想念、关心、调皮</text>
    <text class="tiny" x="1376" y="554" text-anchor="middle">互需、冷却、打断风险</text>
    <path class="arrowOrange" d="M1376 572 V612"/>

    <rect class="nodeOrange" x="1264" y="612" width="224" height="94" rx="12"/>
    <text class="text" x="1376" y="642" text-anchor="middle">大模型裁决话题</text>
    <text class="tiny" x="1376" y="666" text-anchor="middle">必须带证据，不用固定模板</text>
    <text class="tiny" x="1376" y="688" text-anchor="middle">生成短消息候选</text>
    <path class="arrowOrange" d="M1376 706 V746"/>

    <rect class="nodeOrange" x="1264" y="746" width="224" height="86" rx="12"/>
    <text class="text" x="1376" y="778" text-anchor="middle">请求 AstrBot 发送</text>
    <text class="tiny" x="1376" y="802" text-anchor="middle">默认关闭；仍受安静门和冷却</text>
    <path class="arrowOrange" d="M1376 832 V872"/>

    <rect class="nodeOrange" x="1264" y="872" width="224" height="86" rx="12"/>
    <text class="text" x="1376" y="904" text-anchor="middle">记录反馈</text>
    <text class="tiny" x="1376" y="928" text-anchor="middle">未回复、冷场、被打断都会回写</text>
  </g>

  <path class="arrowOrange dash" d="M1152 961 C1204 961 1210 281 1264 281"/>
  <path class="arrowGreen dash" d="M982 1000 C982 1050 560 1050 560 794"/>

  <g id="legend">
    <rect class="badgeBlue" x="58" y="1110" width="350" height="44" rx="14"/>
    <text class="small" x="233" y="1138" text-anchor="middle">蓝色：主回复路径，优先降低用户等待</text>

    <rect class="badgeGreen" x="436" y="1110" width="410" height="44" rx="14"/>
    <text class="small" x="641" y="1138" text-anchor="middle">绿色：后台队列和工作器池，负责慢评估与顺序落库</text>

    <rect class="badgeOrange" x="874" y="1110" width="372" height="44" rx="14"/>
    <text class="small" x="1060" y="1138" text-anchor="middle">橙色：主动发言，不是定时模板，而是状态驱动</text>

    <rect class="laneOld" x="1274" y="1110" width="226" height="44" rx="14"/>
    <text class="small" x="1387" y="1138" text-anchor="middle">灰色：0.5.0 旧单线程链路</text>
  </g>
</svg>
