<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" role="img" aria-labelledby="title desc">
  <title id="title">Sylanne 2.3.13 工作流：上下文归 Agent，投递与反馈归 Sylanne</title>
  <desc id="desc">展示 Sylanne 重构后的工作流。输入侧只做碎片聚合、活跃回复追发合并和短上下文判断，不保存长期上下文；AstrBot Agent 持有完整对话历史、fallback provider 和外部工具循环；Sylanne 在主 LLM 请求前隐藏自有内部工具 schema，但保留 bot、命令、公共 API 和设置 Page 能力；工具调用中间轮次完全放行，只有最终自然语言回复进入即时聊天投递层；投递层负责拆条、打字停顿、表情一致性、用户插话中断和已发未发信封；回复后的情绪、人格、生命化学习、自有记忆和向量召回进入后台队列；主动聊天支路先结算未回应反馈，再结合时间推测、公式门控和 LLM 话题裁决决定是否低压力触达。</desc>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; text-rendering: geometricPrecision; }
      .subtitle { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 18px; fill: #475569; text-rendering: geometricPrecision; }
      .laneTitle { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 22px; font-weight: 800; fill: #1e293b; text-rendering: geometricPrecision; }
      .text { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; text-rendering: geometricPrecision; }
      .small { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 15px; fill: #334155; text-rendering: geometricPrecision; }
      .tiny { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 13px; fill: #475569; text-rendering: geometricPrecision; }
      .note { font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #334155; text-rendering: geometricPrecision; }
      .laneInput { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .laneAgent { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 2; }
      .laneOutput { fill: #fdf2f8; stroke: #fbcfe8; stroke-width: 2; }
      .laneBg { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .lanePro { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .nodeInput { fill: #ffffff; stroke: #2563eb; stroke-width: 2.4; }
      .nodeAgent { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.4; }
      .nodeOutput { fill: #ffffff; stroke: #db2777; stroke-width: 2.4; }
      .nodeBg { fill: #ffffff; stroke: #059669; stroke-width: 2.4; }
      .nodePro { fill: #ffffff; stroke: #ea580c; stroke-width: 2.4; }
      .guard { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; }
      .stop { fill: #fee2e2; stroke: #ef4444; stroke-width: 2.2; }
      .badgeBlue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.4; }
      .badgeViolet { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1.4; }
      .badgePink { fill: #fce7f3; stroke: #f9a8d4; stroke-width: 1.4; }
      .badgeGreen { fill: #dcfce7; stroke: #86efac; stroke-width: 1.4; }
      .badgeOrange { fill: #ffedd5; stroke: #fdba74; stroke-width: 1.4; }
      .badgeGray { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1.4; }
      .bubble { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.3; }
      .replyBubble { fill: #ffffff; stroke: #f9a8d4; stroke-width: 1.3; }
      .arrowBlue { stroke: #2563eb; stroke-width: 3.1; fill: none; marker-end: url(#arrowBlue); }
      .arrowViolet { stroke: #7c3aed; stroke-width: 3.1; fill: none; marker-end: url(#arrowViolet); }
      .arrowPink { stroke: #db2777; stroke-width: 3.1; fill: none; marker-end: url(#arrowPink); }
      .arrowGreen { stroke: #059669; stroke-width: 3.1; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #ea580c; stroke-width: 3.1; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 8 7; }
      .muted { opacity: 0.62; }
    </style>
  </defs>

  <rect class="bg" width="1560" height="1180"/>
  <text class="title" x="56" y="58">Sylanne 2.3.13 工作流：上下文归 Agent，Sylanne 接管投递与反馈</text>
  <text class="subtitle" x="56" y="88">主链路不重放长上下文：输入只合并本轮碎片和等待期追发，Agent 负责上下文与工具循环，Sylanne 只接管最终聊天节奏。</text>

  <g id="lanes-main">
    <rect class="laneInput" x="42" y="126" width="312" height="598" rx="18"/>
    <text class="laneTitle" x="66" y="164">输入侧：轻量 gate</text>
    <text class="small" x="66" y="190">只判断“用户说完了吗”，等待期追发直接并入本轮</text>

    <rect class="laneAgent" x="386" y="126" width="360" height="598" rx="18"/>
    <text class="laneTitle" x="410" y="164">AstrBot Agent：上下文核心</text>
    <text class="small" x="410" y="190">完整历史、fallback、工具循环都留在 Agent 内</text>

    <rect class="laneOutput" x="778" y="126" width="360" height="598" rx="18"/>
    <text class="laneTitle" x="802" y="164">Sylanne：即时聊天投递层</text>
    <text class="small" x="802" y="190">只接管最终自然语言，不截断工具调用</text>

    <rect class="laneInput" x="1170" y="126" width="348" height="598" rx="18"/>
    <text class="laneTitle" x="1194" y="164">模型与工具边界</text>
    <text class="small" x="1194" y="190">快判断短上下文，复杂判断独立，细分工具隐藏</text>
  </g>

  <g id="input-flow">
    <rect class="nodeInput" x="66" y="232" width="264" height="72" rx="14"/>
    <text class="text" x="198" y="262" text-anchor="middle">用户事件进入</text>
    <text class="tiny" x="198" y="286" text-anchor="middle">单聊 / 群聊 / 补充 / 撤回 / 表情</text>
    <path class="arrowBlue" d="M198 304 V342"/>

    <rect class="nodeInput" x="66" y="342" width="264" height="92" rx="14"/>
    <text class="text" x="198" y="374" text-anchor="middle">碎片输入池</text>
    <text class="tiny" x="198" y="398" text-anchor="middle">“我 / 不 / 是 / 老 / 年人”先合并</text>
    <text class="tiny" x="198" y="416" text-anchor="middle">LLM 未回复时追发直接并入同一用户意图</text>
    <path class="arrowBlue" d="M198 434 V472"/>

    <rect class="nodeInput" x="66" y="472" width="264" height="96" rx="14"/>
    <text class="text" x="198" y="504" text-anchor="middle">fast assessor</text>
    <text class="tiny" x="198" y="528" text-anchor="middle">低推理小模型，只看短碎片窗口</text>
    <text class="tiny" x="198" y="548" text-anchor="middle">超时或失败就走本地回退</text>
    <path class="arrowBlue" d="M198 568 V606"/>

    <rect class="nodeInput" x="66" y="606" width="264" height="74" rx="14"/>
    <text class="text" x="198" y="636" text-anchor="middle">释放完整用户意图</text>
    <text class="tiny" x="198" y="660" text-anchor="middle">碎片与等待期追发都只回填短事实</text>
  </g>

  <g id="agent-flow">
    <path class="arrowBlue" d="M330 643 H366 V275 H410"/>
    <rect class="nodeAgent" x="410" y="232" width="312" height="86" rx="14"/>
    <text class="text" x="566" y="264" text-anchor="middle">Agent 持有完整对话历史</text>
    <text class="tiny" x="566" y="288" text-anchor="middle">官方上下文、fallback provider、工具结果都在这里</text>
    <text class="tiny" x="566" y="306" text-anchor="middle">Sylanne 不把整段历史抢到插件里重放</text>
    <path class="arrowViolet" d="M566 318 V356"/>

    <rect class="guard" x="410" y="356" width="312" height="92" rx="14"/>
    <text class="text" x="566" y="388" text-anchor="middle">主请求前隐藏内部 schema</text>
    <text class="tiny" x="566" y="412" text-anchor="middle">query_agent_state 等细分工具不暴露给主 LLM</text>
    <text class="tiny" x="566" y="432" text-anchor="middle">命令、公共 API、设置 Page 仍可用</text>
    <path class="arrowViolet" d="M566 448 V486"/>

    <rect class="nodeAgent" x="410" y="486" width="312" height="88" rx="14"/>
    <text class="text" x="566" y="518" text-anchor="middle">Agent 原生工具循环</text>
    <text class="tiny" x="566" y="542" text-anchor="middle">外部 tool_calls / function_call 完全放行</text>
    <text class="tiny" x="566" y="560" text-anchor="middle">Sylanne 不改写、不 stop_event、不消费 epoch</text>
    <path class="arrowViolet" d="M566 574 V612"/>

    <rect class="nodeAgent" x="410" y="612" width="312" height="76" rx="14"/>
    <text class="text" x="566" y="642" text-anchor="middle">最终自然语言回复</text>
    <text class="tiny" x="566" y="666" text-anchor="middle">只有这一步进入 Sylanne 投递层</text>
  </g>

  <g id="output-flow">
    <path class="arrowViolet" d="M722 650 H760 V273 H802"/>
    <rect class="stop" x="802" y="232" width="312" height="82" rx="14"/>
    <text class="text" x="958" y="264" text-anchor="middle">工具轮次检测</text>
    <text class="tiny" x="958" y="288" text-anchor="middle">若仍是 tool_calls / 工具结果，直接放行</text>
    <path class="arrowPink" d="M958 314 V352"/>

    <rect class="nodeOutput" x="802" y="352" width="312" height="92" rx="14"/>
    <text class="text" x="958" y="384" text-anchor="middle">即时聊天规划</text>
    <text class="tiny" x="958" y="408" text-anchor="middle">按语义、人格、用户说话习惯拆条</text>
    <text class="tiny" x="958" y="428" text-anchor="middle">表情包走本地一致性 + fast assessor</text>
    <path class="arrowPink" d="M958 444 V482"/>

    <rect class="nodeOutput" x="802" y="482" width="312" height="94" rx="14"/>
    <text class="text" x="958" y="514" text-anchor="middle">逐条投递</text>
    <text class="tiny" x="958" y="538" text-anchor="middle">模拟打字速度、停顿和短句节奏</text>
    <text class="tiny" x="958" y="558" text-anchor="middle">用户插话时停止剩余分条与媒体</text>
    <path class="arrowPink" d="M958 576 V614"/>

    <rect class="nodeOutput" x="802" y="614" width="312" height="80" rx="14"/>
    <text class="text" x="958" y="644" text-anchor="middle">投递信封回写</text>
    <text class="tiny" x="958" y="668" text-anchor="middle">记录已发、未发、被打断和原回复摘要</text>
    <rect class="replyBubble" x="830" y="704" width="72" height="24" rx="12"/>
    <text class="tiny" x="866" y="721" text-anchor="middle">已发</text>
    <rect class="replyBubble" x="914" y="704" width="72" height="24" rx="12"/>
    <text class="tiny" x="950" y="721" text-anchor="middle">未发</text>
    <rect class="replyBubble" x="998" y="704" width="90" height="24" rx="12"/>
    <text class="tiny" x="1043" y="721" text-anchor="middle">插话断点</text>
  </g>

  <g id="boundary-flow">
    <rect class="nodeInput" x="1194" y="232" width="300" height="86" rx="14"/>
    <text class="text" x="1344" y="264" text-anchor="middle">快判断模型</text>
    <text class="tiny" x="1344" y="288" text-anchor="middle">碎片完整性、表情一致性</text>
    <text class="tiny" x="1344" y="306" text-anchor="middle">默认 600 字预算，短超时、低温度</text>

    <rect class="nodeAgent" x="1194" y="354" width="300" height="86" rx="14"/>
    <text class="text" x="1344" y="386" text-anchor="middle">复杂判断模型</text>
    <text class="tiny" x="1344" y="410" text-anchor="middle">情绪观测、主动话题裁决</text>
    <text class="tiny" x="1344" y="428" text-anchor="middle">需要更多状态，但不替代 Agent 上下文</text>

    <rect class="guard" x="1194" y="476" width="300" height="92" rx="14"/>
    <text class="text" x="1344" y="508" text-anchor="middle">内部能力归 bot</text>
    <text class="tiny" x="1344" y="532" text-anchor="middle">细分工具对所有主聊天 LLM 隐藏</text>
    <text class="tiny" x="1344" y="552" text-anchor="middle">插件功能通过短状态、召回、API、Page 生效</text>

    <rect class="badgeGray" x="1194" y="616" width="300" height="80" rx="14"/>
    <text class="note" x="1344" y="646" text-anchor="middle">模型兼容兜底</text>
    <text class="tiny" x="1344" y="670" text-anchor="middle">空回、拦截和切换不破坏工具循环</text>
    <text class="tiny" x="1344" y="688" text-anchor="middle">失败回退仍由 Agent 主链路接住</text>
  </g>

  <path class="arrowPink dash" d="M802 654 C740 714 670 714 612 674"/>
  <text class="tiny" x="702" y="720" text-anchor="middle">已发/未发信封只作为短事实回到下一轮 Agent 请求</text>

  <g id="background-lane">
    <rect class="laneBg" x="42" y="764" width="704" height="318" rx="18"/>
    <text class="laneTitle" x="66" y="802">回复后后台：状态、记忆、向量召回</text>
    <text class="small" x="66" y="828">慢任务离开主回复链路，同会话按 sequence 顺序落库</text>

    <rect class="nodeBg" x="70" y="866" width="156" height="74" rx="14"/>
    <text class="text" x="148" y="896" text-anchor="middle">post 队列</text>
    <text class="tiny" x="148" y="920" text-anchor="middle">回复后再评估</text>
    <path class="arrowGreen" d="M226 903 H270"/>

    <rect class="nodeBg" x="270" y="866" width="186" height="74" rx="14"/>
    <text class="text" x="363" y="896" text-anchor="middle">动态 workers</text>
    <text class="tiny" x="363" y="920" text-anchor="middle">CPU / 内存 / 队列压力</text>
    <path class="arrowGreen" d="M456 903 H500"/>

    <rect class="nodeBg" x="500" y="866" width="206" height="74" rx="14"/>
    <text class="text" x="603" y="896" text-anchor="middle">状态落库</text>
    <text class="tiny" x="603" y="920" text-anchor="middle">emotion / lifelike / drift</text>

    <rect class="nodeBg" x="70" y="970" width="196" height="72" rx="14"/>
    <text class="text" x="168" y="1000" text-anchor="middle">自有记忆写入</text>
    <text class="tiny" x="168" y="1024" text-anchor="middle">稳定输入与关键摘要</text>
    <path class="arrowGreen" d="M266 1006 H318"/>

    <rect class="nodeBg" x="318" y="970" width="178" height="72" rx="14"/>
    <text class="text" x="407" y="1000" text-anchor="middle">混合召回</text>
    <text class="tiny" x="407" y="1024" text-anchor="middle">关键词 + 向量 + 关联图</text>
    <path class="arrowGreen dash" d="M496 1006 C590 1006 620 760 566 688"/>
    <text class="tiny" x="604" y="1024">只回流限长摘要</text>
  </g>

  <g id="proactive-lane">
    <rect class="lanePro" x="778" y="764" width="740" height="318" rx="18"/>
    <text class="laneTitle" x="802" y="802">主动聊天：反馈先行，低频触达</text>
    <text class="small" x="802" y="828">不是固定话题库，也不是无限关心进度；有理由才轻轻开口</text>

    <rect class="nodePro" x="806" y="866" width="168" height="74" rx="14"/>
    <text class="text" x="890" y="896" text-anchor="middle">候选会话</text>
    <text class="tiny" x="890" y="920" text-anchor="middle">最近可触达、未冷却</text>
    <path class="arrowOrange" d="M974 903 H1016"/>

    <rect class="nodePro" x="1016" y="866" width="188" height="74" rx="14"/>
    <text class="text" x="1110" y="896" text-anchor="middle">结算上一条反馈</text>
    <text class="tiny" x="1110" y="920" text-anchor="middle">unanswered / cold_reply / pending</text>
    <path class="arrowOrange" d="M1204 903 H1246"/>

    <rect class="nodePro" x="1246" y="866" width="228" height="74" rx="14"/>
    <text class="text" x="1360" y="896" text-anchor="middle">时间推测</text>
    <text class="tiny" x="1360" y="920" text-anchor="middle">忙、休息、睡觉，不默认被无视</text>

    <rect class="nodePro" x="806" y="970" width="194" height="72" rx="14"/>
    <text class="text" x="903" y="1000" text-anchor="middle">公式门控</text>
    <text class="tiny" x="903" y="1024" text-anchor="middle">想念、互需、修复、打扰风险</text>
    <path class="arrowOrange" d="M1000 1006 H1042"/>

    <rect class="nodePro" x="1042" y="970" width="198" height="72" rx="14"/>
    <text class="text" x="1141" y="1000" text-anchor="middle">LLM 证据裁决</text>
    <text class="tiny" x="1141" y="1024" text-anchor="middle">无新证据就沉默</text>
    <path class="arrowOrange" d="M1240 1006 H1282"/>

    <rect class="nodePro" x="1282" y="970" width="192" height="72" rx="14"/>
    <text class="text" x="1378" y="1000" text-anchor="middle">低压力发送</text>
    <text class="tiny" x="1378" y="1024" text-anchor="middle">想念也只短句，不抓旧话题</text>
  </g>

  <g id="legend">
    <rect class="badgeBlue" x="56" y="1114" width="250" height="42" rx="14"/>
    <text class="small" x="181" y="1140" text-anchor="middle">蓝色：输入 gate，只合并本轮碎片</text>
    <rect class="badgeViolet" x="334" y="1114" width="276" height="42" rx="14"/>
    <text class="small" x="472" y="1140" text-anchor="middle">紫色：Agent 拥有上下文和工具循环</text>
    <rect class="badgePink" x="638" y="1114" width="260" height="42" rx="14"/>
    <text class="small" x="768" y="1140" text-anchor="middle">粉色：Sylanne 只接管最终投递</text>
    <rect class="badgeGreen" x="926" y="1114" width="260" height="42" rx="14"/>
    <text class="small" x="1056" y="1140" text-anchor="middle">绿色：后台状态与记忆</text>
    <rect class="badgeOrange" x="1214" y="1114" width="288" height="42" rx="14"/>
    <text class="small" x="1358" y="1140" text-anchor="middle">橙色：主动聊天反馈闭环</text>
  </g>
</svg>
