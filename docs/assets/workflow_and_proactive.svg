<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1240" viewBox="0 0 1460 1240" role="img" aria-labelledby="title desc">
  <title id="title">工作流与主动发言支路</title>
  <desc id="desc">展示 AstrBot 请求响应生命周期、带 CPU/内存环境守卫和全局预算的后台智能 worker、判断 LLM 并发闸门、并行状态读取、主动发言裁决和主动发送请求流程。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
      .panelWorker { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .panelProactive { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .nodeGreen { fill: #ffffff; stroke: #047857; stroke-width: 2; }
      .nodeOrange { fill: #ffffff; stroke: #9a3412; stroke-width: 2; }
      .decision { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; fill: #0f172a; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #334155; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .arrowBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>
  <rect class="bg" width="1460" height="1240"/>

  <rect class="panel" x="34" y="34" width="430" height="1156" rx="18"/>
  <text class="label" x="62" y="74">请求 / 回复生命周期</text>
  <g>
    <rect class="node" x="86" y="108" width="260" height="62" rx="12"/>
    <text class="text" x="216" y="146" text-anchor="middle">用户输入 / 插件输入</text>

    <rect class="node" x="86" y="210" width="260" height="74" rx="12"/>
    <text class="text" x="216" y="241" text-anchor="middle">读取会话与 persona</text>
    <text class="small" x="216" y="266" text-anchor="middle">conversation / speaker</text>

    <rect class="node" x="86" y="324" width="260" height="86" rx="12"/>
    <text class="text" x="216" y="356" text-anchor="middle">并发加载状态</text>
    <text class="small" x="216" y="382" text-anchor="middle">emotion + auxiliary snapshots</text>

    <path class="decision" d="M216 456 L342 516 L216 576 L90 516 Z"/>
    <text class="text" x="216" y="510" text-anchor="middle">pre 更新?</text>
    <text class="small" x="216" y="537" text-anchor="middle">assessment_timing</text>

    <rect class="node" x="86" y="624" width="260" height="82" rx="12"/>
    <text class="text" x="216" y="656" text-anchor="middle">生成观测 X_t</text>
    <text class="small" x="216" y="682" text-anchor="middle">短输出 LLM 或启发式</text>

    <rect class="node" x="86" y="746" width="260" height="84" rx="12"/>
    <text class="text" x="216" y="779" text-anchor="middle">预算内注入状态</text>
    <text class="small" x="216" y="806" text-anchor="middle">emotion / humanlike / group 等</text>

    <rect class="node" x="86" y="870" width="260" height="66" rx="12"/>
    <text class="text" x="216" y="910" text-anchor="middle">主 LLM 回复先返回</text>
  </g>
  <path class="arrowBlue" d="M216 170 V210"/>
  <path class="arrowBlue" d="M216 284 V324"/>
  <path class="arrowBlue" d="M216 410 V456"/>
  <path class="arrowBlue" d="M216 576 V624"/>
  <path class="arrowBlue" d="M216 706 V746"/>
  <path class="arrowBlue" d="M216 830 V870"/>

  <rect class="panelWorker" x="514" y="34" width="430" height="1156" rx="18"/>
  <text class="label" x="542" y="74">post 后台与智能 worker 守卫</text>
  <g>
    <rect class="nodeGreen" x="574" y="108" width="270" height="74" rx="12"/>
    <text class="text" x="709" y="139" text-anchor="middle">post 任务进入队列</text>
    <text class="small" x="709" y="164" text-anchor="middle">记录 sequence，不阻塞主回复</text>

    <path class="decision" d="M709 232 L846 294 L709 356 L572 294 Z"/>
    <text class="text" x="709" y="287" text-anchor="middle">压力评分</text>
    <text class="small" x="709" y="315" text-anchor="middle">队列/等待/重试/租约</text>

    <rect class="nodeGreen" x="574" y="404" width="270" height="92" rx="12"/>
    <text class="text" x="709" y="437" text-anchor="middle">资源守卫</text>
    <text class="small" x="709" y="464" text-anchor="middle">CPU / 内存压力</text>
    <text class="small" x="709" y="488" text-anchor="middle">未知压力保守降档</text>

    <rect class="nodeGreen" x="574" y="544" width="270" height="92" rx="12"/>
    <text class="text" x="709" y="578" text-anchor="middle">全局预算和平滑扩容</text>
    <text class="small" x="709" y="604" text-anchor="middle">同时活跃总上限 6</text>
    <text class="small" x="709" y="628" text-anchor="middle">冷却内每轮最多升 1 档</text>

    <rect class="nodeGreen" x="574" y="684" width="270" height="92" rx="12"/>
    <text class="text" x="709" y="718" text-anchor="middle">判断 LLM 闸门</text>
    <text class="small" x="709" y="744" text-anchor="middle">默认 2 路，极端最多 3</text>
    <text class="small" x="709" y="768" text-anchor="middle">最低完整 JSON / 本地轻评估</text>

    <rect class="nodeGreen" x="574" y="824" width="270" height="92" rx="12"/>
    <text class="text" x="709" y="858" text-anchor="middle">顺序提交与诊断</text>
    <text class="small" x="709" y="884" text-anchor="middle">KV / LivingMemory 注解</text>
    <text class="small" x="709" y="908" text-anchor="middle">重试 / dead-letter / runtime</text>
  </g>
  <path class="arrowGreen" d="M709 182 V232"/>
  <path class="arrowGreen" d="M709 356 V404"/>
  <path class="arrowGreen" d="M709 496 V544"/>
  <path class="arrowGreen" d="M709 636 V684"/>
  <path class="arrowGreen" d="M709 776 V824"/>
  <path class="arrowGreen dash" d="M346 903 C432 903 432 145 574 145"/>

  <rect class="panelProactive" x="994" y="34" width="430" height="1156" rx="18"/>
  <text class="label" x="1022" y="74">主动发言裁决与发送</text>
  <g>
    <rect class="nodeOrange" x="1054" y="108" width="270" height="74" rx="12"/>
    <text class="text" x="1189" y="139" text-anchor="middle">调度器 / 工具</text>
    <text class="small" x="1189" y="164" text-anchor="middle">decision 或 dispatch API</text>

    <rect class="nodeOrange" x="1054" y="230" width="270" height="92" rx="12"/>
    <text class="text" x="1189" y="263" text-anchor="middle">并发读取状态</text>
    <text class="small" x="1189" y="290" text-anchor="middle">情绪、共同语境、群聊</text>
    <text class="small" x="1189" y="314" text-anchor="middle">拟人状态、人格漂移</text>

    <rect class="nodeOrange" x="1054" y="370" width="270" height="98" rx="12"/>
    <text class="text" x="1189" y="401" text-anchor="middle">计算开口分数</text>
    <text class="small" x="1189" y="428" text-anchor="middle">互需平衡、冷却</text>
    <text class="small" x="1189" y="452" text-anchor="middle">沉默舒适度、打断风险</text>

    <path class="decision" d="M1189 516 L1328 578 L1189 640 L1050 578 Z"/>
    <text class="text" x="1189" y="571" text-anchor="middle">允许开口?</text>
    <text class="small" x="1189" y="599" text-anchor="middle">公式门控</text>

    <rect class="nodeOrange" x="1054" y="690" width="270" height="86" rx="12"/>
    <text class="text" x="1189" y="720" text-anchor="middle">抽取候选证据</text>
    <text class="small" x="1189" y="746" text-anchor="middle">进度 / 想念 / 调皮</text>
    <text class="small" x="1189" y="768" text-anchor="middle">整蛊 / 修复 / 黑话</text>

    <rect class="nodeOrange" x="1054" y="824" width="270" height="92" rx="12"/>
    <text class="text" x="1189" y="856" text-anchor="middle">LLM 裁决需求</text>
    <text class="small" x="1189" y="882" text-anchor="middle">理由 / 证据 / 短句草案</text>
    <text class="small" x="1189" y="904" text-anchor="middle">不使用固定话题模板</text>

    <rect class="nodeOrange" x="1054" y="960" width="270" height="88" rx="12"/>
    <text class="text" x="1189" y="991" text-anchor="middle">生成 dispatch_request</text>
    <text class="small" x="1189" y="1017" text-anchor="middle">origin / reason / evidence</text>
    <text class="small" x="1189" y="1039" text-anchor="middle">idempotency / TTL</text>

    <path class="decision" d="M1189 1080 L1328 1136 L1189 1192 L1050 1136 Z"/>
    <text class="text" x="1189" y="1129" text-anchor="middle">执行发送?</text>
    <text class="small" x="1189" y="1155" text-anchor="middle">开关、冷却、origin</text>
  </g>
  <path class="arrowOrange" d="M1189 182 V230"/>
  <path class="arrowOrange" d="M1189 322 V370"/>
  <path class="arrowOrange" d="M1189 468 V516"/>
  <path class="arrowOrange" d="M1189 640 V690"/>
  <path class="arrowOrange" d="M1189 776 V824"/>
  <path class="arrowOrange" d="M1189 916 V960"/>
  <path class="arrowOrange" d="M1189 1048 V1080"/>
  <path class="arrowOrange dash" d="M844 870 C950 870 950 276 1054 276"/>
</svg>
