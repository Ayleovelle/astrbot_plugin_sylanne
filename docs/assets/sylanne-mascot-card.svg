<svg xmlns="http://www.w3.org/2000/svg" width="330" height="260" viewBox="0 0 330 260" role="img" aria-labelledby="title desc">
  <title id="title">Sylanne logo card</title>
  <desc id="desc">Sylanne project logo</desc>
  <defs>
    <clipPath id="logoClip">
      <rect x="45" y="0" width="240" height="220" rx="28" ry="28"/>
    </clipPath>
  </defs>
  <rect x="30" y="0" width="270" height="250" rx="18" fill="#fff7e6"/>
  <image href="sylanne-mascot.gif" x="45" y="0" width="240" height="220" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text x="165" y="238" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#5f6470">Sylanne</text>
</svg>
