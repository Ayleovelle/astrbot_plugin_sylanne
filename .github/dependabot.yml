version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # 同样建议加上分组，防止 Python 依赖更新刷屏
    groups:
      python-dependencies:
        patterns:
          - "*"
    # aiohttp 必须跟随 AstrBot 核心锁定的版本，不能让 dependabot 顶高下限
    # （否则会触发"依赖版本保护冲突"，阻止插件安装）
    ignore:
      - dependency-name: "aiohttp"
