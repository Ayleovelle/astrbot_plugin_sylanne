name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'metadata.yaml'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version from metadata.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' metadata.yaml | sed 's/version: *//' | sed 's/ *#.*//' | tr -d ' "\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "Embodiment-${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release Embodiment-${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog for version
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > /tmp/extract_changelog.py << 'PYTHON_SCRIPT'
          import re, sys

          version = sys.argv[1]

          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
          except FileNotFoundError:
              print('修复了一些已知问题')
              sys.exit(0)

          # Try new format: ## [vX.Y.Z] - YYYY-MM-DD
          pattern = rf'## \[v{re.escape(version)}\]\s*-\s*\d{{4}}-\d{{2}}-\d{{2}}\s*\n(.*?)(?=\n## \[|\n## \d|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              # Try old format: ## X.Y.Z\n\n发布日期：...
              pattern = rf'## {re.escape(version)}\s*\n+(?:发布日期：[^\n]*\n)?\s*\n?(.*?)(?=\n## |\Z)'
              match = re.search(pattern, content, re.DOTALL)

          if match:
              changelog = match.group(1).strip()
              # Remove trailing horizontal rules
              changelog = re.sub(r'\n---\s*$', '', changelog).strip()
              if changelog:
                  print(changelog)
              else:
                  print('修复了一些已知问题')
          else:
              print('修复了一些已知问题')
          PYTHON_SCRIPT

          python3 /tmp/extract_changelog.py "$VERSION" > /tmp/changelog_output.txt
          CHANGELOG=$(cat /tmp/changelog_output.txt)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="修复了一些已知问题"
          fi
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install deps
        if: steps.check.outputs.exists == 'false'
        run: pip install aiohttp

      - name: Build plugin zip
        if: steps.check.outputs.exists == 'false'
        run: python scripts/package_plugin.py --output dist/astrbot_plugin_sylanne-${{ steps.version.outputs.version }}.zip

      - name: Verify zip contents
        if: steps.check.outputs.exists == 'false'
        run: |
          python -c "
          import zipfile, sys
          required = [
              'astrbot_plugin_sylanne/main.py',
              'astrbot_plugin_sylanne/metadata.yaml',
              'astrbot_plugin_sylanne/__init__.py',
              'astrbot_plugin_sylanne/README.md',
              'astrbot_plugin_sylanne/sylanne_alpha/__init__.py',
              'astrbot_plugin_sylanne/sylanne_alpha/host.py',
              'astrbot_plugin_sylanne/sylanne_alpha/_engine/sylanne_core/__init__.py',
          ]
          zp = 'dist/astrbot_plugin_sylanne-${{ steps.version.outputs.version }}.zip'
          with zipfile.ZipFile(zp) as zf:
              names = zf.namelist()
              missing = [r for r in required if r not in names]
              if missing:
                  print(f'Missing: {missing}')
                  sys.exit(1)
              bad = [n for n in names if '.pyc' in n or '__pycache__' in n]
              if bad:
                  print(f'Unwanted: {bad}')
                  sys.exit(1)
          print(f'{zp}: OK ({len(names)} files)')
          "

      - name: Import smoke test from zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/verify && cd /tmp/verify
          unzip -q $GITHUB_WORKSPACE/dist/astrbot_plugin_sylanne-${{ steps.version.outputs.version }}.zip
          python -c "
          import sys
          sys.path.insert(0, '/tmp/verify/astrbot_plugin_sylanne')
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              'main', '/tmp/verify/astrbot_plugin_sylanne/main.py'
          )
          mod = importlib.util.module_from_spec(spec)
          sys.modules['main'] = mod
          spec.loader.exec_module(mod)
          print('Import from zip OK')
          "

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Embodiment-${{ steps.version.outputs.version }}"
          name: "Sylanne-Embodiment ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          files: |
            dist/astrbot_plugin_sylanne-${{ steps.version.outputs.version }}.zip
