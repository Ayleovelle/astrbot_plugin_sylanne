name: Fuck-U-Code fermentation report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.json"
      - "README.md"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/fuck-u-code.yml"

permissions:
  contents: write

jobs:
  update-report:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Fuck-U-Code
        run: npm install -g eff-u-code@2.2.2

      - name: Run Fuck-U-Code
        run: |
          mkdir -p output/fuck_u_code
          fuck-u-code analyze . \
            -f json \
            -o output/fuck_u_code/raw-report.json \
            -t 20 \
            -l zh \
            -e "dist/**" \
            -e "output/**" \
            -e "docs/reports/**" \
            -e ".git/**" \
            -e "literature_kb/**" \
            -e "personality_literature_kb/**" \
            -e "psychological_literature_kb/**" \
            -e "humanlike_agent_literature_kb/**" \
            -e "**/__pycache__/**" \
            -e "**/.pytest_cache/**"
          fuck-u-code analyze . \
            -f markdown \
            -o output/fuck_u_code/raw-report.md \
            -t 20 \
            -l zh \
            -e "dist/**" \
            -e "output/**" \
            -e "docs/reports/**" \
            -e ".git/**" \
            -e "literature_kb/**" \
            -e "personality_literature_kb/**" \
            -e "psychological_literature_kb/**" \
            -e "humanlike_agent_literature_kb/**" \
            -e "**/__pycache__/**" \
            -e "**/.pytest_cache/**"

      - name: Update badges and report
        run: python scripts/update_fuck_u_code_report.py

      - name: Commit updated report
        run: |
          if [[ -z "$(git status --porcelain docs/reports)" ]]; then
            echo "Fuck-U-Code report is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/fuck-u-code.md docs/reports/fuck-u-code-fermentation.svg
          git commit -m "chore: update Fuck-U-Code fermentation report [skip ci]"
          git push
