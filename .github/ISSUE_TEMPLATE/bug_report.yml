name: '🐛 报告 Bug'
description: 提交 Bug 报告帮助我们改进 Sylanne。
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间报告问题！请尽量提供完整信息，这能帮助我们更快定位和修复。

  - type: textarea
    attributes:
      label: 发生了什么
      description: 描述你遇到的异常行为。
      placeholder: >
        清晰具体地描述这个 bug 是什么，预期行为是什么。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 如何复现
      description: 复现该问题的步骤。
      placeholder: |
        1. 发送消息 '...'
        2. 等待回复
        3. 观察到 '...'
    validations:
      required: true

  - type: input
    attributes:
      label: 插件版本
      description: 请填写你当前使用的 Sylanne 版本（在 metadata.yaml 或插件管理页查看）。
      placeholder: '如: 1.4.2'
    validations:
      required: true

  - type: input
    attributes:
      label: AstrBot 版本
      description: 请填写你当前使用的 AstrBot 版本。
      placeholder: '如: v4.25.0'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Python 版本
      description: 你的运行环境使用的 Python 版本。
      options:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '不确定'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 操作系统
      description: 你在哪个操作系统上遇到了这个问题？
      options:
        - 'Windows'
        - 'Linux'
        - 'macOS'
        - '其他'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 部署方式
      description: 请选择最接近的一项。
      options:
        - 'AstrBot Launcher'
        - 'Docker / Docker Compose'
        - '手动部署（源码 / uv / pip）'
        - '其他'
        - '不确定'
    validations:
      required: true

  - type: textarea
    attributes:
      label: 报错日志
      description: 请提供完整的报错日志（INFO 或 Debug 级别）。可以很长，不用担心。
      placeholder: >
        粘贴完整的 traceback 或相关日志。
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: 补充说明
      description: 其他你认为有帮助的信息（截图、配置、使用的其他插件等）。

  - type: checkboxes
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issues，确认没有重复提交。
          required: true
